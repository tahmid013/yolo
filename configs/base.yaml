# Shared hyperparameters. Variant configs (yolo11s.yaml etc.) deep-merge on top.
# All keys under `train:` are passed through to ultralytics.YOLO().train(**kwargs).
# Mirrors the reference args.yaml found in report_generation/YOLOv11m/.

train:
  epochs: 250
  patience: 100
  batch: 16
  imgsz: 832
  optimizer: auto
  lr0: 0.01
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0
  auto_augment: randaugment
  erasing: 0.4
  close_mosaic: 10
  seed: 0
  deterministic: true
  cos_lr: false
  amp: true
  val: true
  plots: true
  save: true
  save_period: -1
  cache: false
